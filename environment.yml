name: py_textbook
channels:
  - conda-forge
dependencies:
  - python=3.11
  - nbclassic=1.1.0
  - notebook=6.5.4 # - jupyter_contrib_nbextensions
  - jupyter_nbextensions_configurator=0.6.4
  - numpy=1.26.0
  - pandas=2.2.0
  - matplotlib=3.8.4
  - seaborn=0.13.0
  - scikit-learn=1.5.0
  - statsmodels=0.14.2
  - scipy=1.13.1
  - ipywidgets=8.1.3
